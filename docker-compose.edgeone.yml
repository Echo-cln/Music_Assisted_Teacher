services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:///./data/zhiban.db
      UPLOAD_DIR: data/uploads
      # 改为实际 EdgeOne Pages 域名，多个域名用英文逗号分隔。
      ALLOWED_ORIGINS: https://your-pages-domain.edgeone.app
      SESSION_COOKIE_SECURE: "true"
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      AI_FAST_BASE_URL: ${AI_FAST_BASE_URL}
      AI_FAST_API_KEY: ${AI_FAST_API_KEY}
      AI_FAST_MODEL: ${AI_FAST_MODEL}
    volumes:
      - ./runtime:/app/backend/data
